version: '3.8'

services:
  ytclip:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ytclip_prod
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - DEBUG=0
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      - GEMINI_PROXY=${GEMINI_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
